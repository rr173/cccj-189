[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddreduce"
version = "1.2.0"
description = "Failure-input reducer for relational JSONL data and CDC transaction histories (1-minimal repro packages), with offline capture-v1/v2 ingestion (schema history)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ddreduce = "ddreduce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
